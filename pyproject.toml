[build-system]
requires = ["flit_core >=3.7,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pharmamp"
version = "0.1.0"
description = "Pharmaceutical-developability metrics for AI-designed antimicrobial peptides"
authors = [{name = "Muhammad Talaat"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "seqme",
    "peptides",
    "numpy",
    "pandas",
    "biopython",
    "streamlit",
    "h5py",
]

[project.optional-dependencies]
dev = ["pytest"]
# Needed only for pharmamp/benchmark/validate_against_wetlab.py.
validate = ["scipy", "openpyxl"]
# Needed only to run inference through the vendored OmegAMP checkpoint
# (third_party/OmegAMP) — kept out of the core install so the metrics
# framework itself stays lightweight.
benchmark = [
    "lightning ~= 2.2",
    "hydra-core ~= 1.3",
    "fair-esm == 2.0.0",
    "transformers",
    "modlamp",
    "xgboost",
    "levenshtein",
    "peptidy",
    "einops",
    "wandb",  # imported transitively by OmegAMP's callbacks module, unused at inference time
]
